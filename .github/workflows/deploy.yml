name: deploy
run-name: deploy ${{ inputs.repo }} @ ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repo, e.g. wlgdev/mybot'
        required: true
        type: string
      sha:
        description: 'Full 40-char commit SHA to deploy'
        required: true
        type: string
      docker_compose_path:
        description: 'Compose file path inside the source repo'
        required: false
        default: 'docker-compose.yml'
        type: string
      is_dev:
        description: 'true = separate -dev stack, false = prod stack'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      env:
        description: 'Extra KEY=VALUE lines, exported for docker compose at deploy time (not stored on server)'
        required: false
        default: ''
        type: string
      target:
        description: 'Traefik routing: SUBDOMAIN:SERVICE:PORT lines'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-${{ inputs.repo }}-${{ inputs.is_dev }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Validate inputs
        env:
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          COMPOSE_PATH: ${{ inputs.docker_compose_path }}
          IS_DEV: ${{ inputs.is_dev }}
          TARGET: ${{ inputs.target }}
          ENV_INPUT: ${{ inputs.env }}
        run: |
          set -eu

          # --- repo, app name, sha, compose path ---
          case "$REPO" in wlgdev/*) ;; *) echo "::error::repo must be in wlgdev org"; exit 1;; esac
          APP="${REPO#wlgdev/}"
          case "$APP" in ''|*[!a-z0-9-]*) echo "::error::bad app name"; exit 1;; esac
          case "$SHA" in *[!0-9a-f]*|'') echo "::error::sha must be hex"; exit 1;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::sha must be full 40-char"; exit 1; }
          case "$COMPOSE_PATH" in ''|*..*|/*) echo "::error::bad docker_compose_path"; exit 1;; esac
          case "$IS_DEV" in true|false) ;; *) echo "::error::is_dev must be true/false"; exit 1;; esac

          # --- target lines: SUBDOMAIN:SERVICE:PORT ---
          if [ -n "$TARGET" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              case "$line" in
                *[!a-zA-Z0-9.:_-]*) echo "::error::bad characters in target: $line"; exit 1 ;;
              esac
              IFS=':' read -r t_domain t_service t_port extra <<< "$line"
              [ -n "$extra" ] && { echo "::error::target must have format SUBDOMAIN:SERVICE:PORT"; exit 1; }
              [ -n "$t_domain" ] && [ -n "$t_service" ] && [ -n "$t_port" ] || { echo "::error::invalid target line: $line"; exit 1; }
              case "$t_domain" in *[!a-zA-Z0-9.-]*|'') echo "::error::bad subdomain in target: $t_domain"; exit 1 ;; esac
              case "$t_service" in *[!a-zA-Z0-9_-]*|'') echo "::error::bad service name in target: $t_service"; exit 1 ;; esac
              case "$t_port" in *[!0-9]*|'') echo "::error::port must be numeric: $t_port"; exit 1 ;; esac
              if [ "$t_port" -lt 1 ] || [ "$t_port" -gt 65535 ]; then
                echo "::error::port out of range: $t_port"; exit 1
              fi
            done <<< "$TARGET"
          fi

          [ "$IS_DEV" = "true" ] && APP="$APP-dev"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo -e "\033[1;32m✅ inputs OK → stack: $APP, commit: ${SHA:0:7}\033[0m"

          # --- summary: what is being deployed ---
          IMG_NAME="$(printf '%s' "$ENV_INPUT" | grep '^SERVICE_IMAGE_NAME=' | head -1 | cut -d= -f2- || true)"
          IMG_TAG="$(printf '%s' "$ENV_INPUT" | grep '^SERVICE_IMAGE_TAG=' | head -1 | cut -d= -f2- || true)"
          IMAGE="${IMG_NAME:-—}:${IMG_TAG:-—}"
          if [ -z "$TARGET" ]; then
            ROUTES="— (headless)"
          else
            case "$IS_DEV" in true) SUFFIX="dev.wlg.tv";; *) SUFFIX="wlg.tv";; esac
            ROUTES="$(while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              sub="${line%%:*}"
              sub="${sub%.dev.wlg.tv}"
              sub="${sub%.wlg.tv}"
              printf 'https://%s.%s<br>' "$sub" "$SUFFIX"
            done <<< "$TARGET")"
          fi
          {
            echo "## 🚀 Deploy \`$REPO\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Stack | \`$APP\` |"
            echo "| Commit | \`${SHA:0:7}\` |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Routes | $ROUTES |"
            echo "| Path | \`/data/apps/$APP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.ORG_READ_PAT }}
          path: app

      - name: 🌐 Generate Traefik override
        if: ${{ inputs.target != '' }}
        env:
          APP: ${{ env.APP }}
          IS_DEV: ${{ inputs.is_dev }}
          TARGET: ${{ inputs.target }}
        run: |
          set -eu

          # --- build docker-compose.override.yml from target lines ---
          python3 - << 'EOF'
          import os, sys

          target = os.environ.get("TARGET", "").strip()
          if not target:
              sys.exit(0)

          app = os.environ["APP"]
          is_dev = os.environ.get("IS_DEV") == "true"
          domain_suffix = "dev.wlg.tv" if is_dev else "wlg.tv"
          network_name = f"proxy-{app}-network"

          services = {}
          for line in target.splitlines():
              line = line.strip()
              if not line:
                  continue
              parts = line.split(":")
              if len(parts) != 3:
                  sys.exit(f"Invalid target entry: {line}")
              subdomain, service, port = parts
              subdomain = subdomain.removesuffix(".dev.wlg.tv").removesuffix(".wlg.tv")
              host = f"{subdomain}.{domain_suffix}"
              route = f"{app}-{service}"
              services[service] = {
                  "host": host,
                  "route": route,
                  "port": port,
              }

          lines = [
              "networks:",
              f"  {network_name}:",
              "    external: true",
              "services:",
          ]

          for service_name, cfg in services.items():
              route = cfg["route"]
              port = cfg["port"]
              host = cfg["host"]
              lines.extend([
                  f"  {service_name}:",
                  "    networks:",
                  "      - default",
                  f"      - {network_name}",
                  "    labels:",
                  "      - \"traefik.enable=true\"",
                  f"      - \"traefik.http.services.{route}.loadbalancer.server.port={port}\"",
                  f"      - \"traefik.http.routers.{route}.rule=Host(`{host}`)\"",
                  f"      - \"traefik.http.routers.{route}.tls=true\"",
                  f"      - \"traefik.http.routers.{route}.tls.certresolver=letsencrypt\"",
                  f"      - \"traefik.http.routers.{route}.entrypoints=websecure\"",
                  f"      - \"traefik.docker.network={network_name}\"",
              ])

          with open("docker-compose.override.yml", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF
          echo "📄 docker-compose.override.yml generated"

      - name: 🚀 Deploy stack over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          COMPOSE_PATH: ${{ inputs.docker_compose_path }}
          ENV_INPUT: ${{ inputs.env }}
        run: |
          set -eu

          # --- ssh setup ---
          test -f "app/$COMPOSE_PATH" || { echo "::error::compose not found: $COMPOSE_PATH"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : "${SSH_USER:=deploy}"
          : "${SSH_PORT:=22}"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          REMOTE="$SSH_USER@$SSH_HOST"

          # --- upload: compose (+ override) and secrets ---
          $SSH "$REMOTE" "mkdir -p /data/apps/$APP"
          scp -P "$SSH_PORT" -i ~/.ssh/deploy_key "app/$COMPOSE_PATH" "$REMOTE:/data/apps/$APP/docker-compose.yml.new"
          if [ -f "docker-compose.override.yml" ]; then
            scp -P "$SSH_PORT" -i ~/.ssh/deploy_key "docker-compose.override.yml" "$REMOTE:/data/apps/$APP/docker-compose.override.yml.new"
          fi
          if [ -n "$ENV_INPUT" ]; then
            printf '%s' "$ENV_INPUT" | $SSH "$REMOTE" "cat > /data/apps/$APP/.env.tmp && chmod 600 /data/apps/$APP/.env.tmp"
          fi
          echo "📄 compose uploaded → /data/apps/$APP/docker-compose.yml"

          # --- swap files, export secrets, (re)start the stack ---
          # ponytail: secrets live only in this session env, never on disk (values must not contain newlines)
          $SSH "$REMOTE" "cd /data/apps/$APP \
            && rm -f .env \
            && mv docker-compose.yml.new docker-compose.yml \
            && if [ -f docker-compose.override.yml.new ]; then mv docker-compose.override.yml.new docker-compose.override.yml; else rm -f docker-compose.override.yml; fi \
            && if [ -f .env.tmp ]; then while IFS='=' read -r k v || [ -n \"\$k\" ]; do case \"\$k\" in ''|\#*) ;; *) export \"\$k=\$v\";; esac; done < .env.tmp; rm -f .env.tmp; fi \
            && docker compose pull \
            && docker compose up -d --remove-orphans"

          # --- traefik network: attach proxy, or detach + remove when headless ---
          # (runs after up, so removal finds no attached app containers — no orphans)
          $SSH "$REMOTE" "cd /data/apps/$APP \
            && if [ -f docker-compose.override.yml ]; then \
              (docker network inspect \"proxy-$APP-network\" >/dev/null 2>&1 || docker network create \"proxy-$APP-network\") \
              && if docker ps --format '{{.Names}}' | grep -qx coolify-proxy; then \
                docker inspect -f '{{json .NetworkSettings.Networks}}' coolify-proxy | grep -q \"\\\"proxy-$APP-network\\\"\" \
                || docker network connect \"proxy-$APP-network\" coolify-proxy; \
              fi; \
            else \
              if docker network inspect \"proxy-$APP-network\" >/dev/null 2>&1; then \
                docker network disconnect \"proxy-$APP-network\" coolify-proxy 2>/dev/null || true; \
                docker network rm \"proxy-$APP-network\"; \
              fi; \
            fi"

          # --- drop old images, show + record status ---
          $SSH "$REMOTE" "cd /data/apps/$APP \
            && docker image prune -f \
            && docker image prune -a -f --filter \"until=168h\""
          PS_OUT="$($SSH "$REMOTE" "cd /data/apps/$APP && docker compose ps")"
          echo "$PS_OUT"
          {
            echo ""
            echo "### ✅ Stack is up"
            echo '```'
            echo "$PS_OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo -e "\033[1;32m✅ $APP is up\033[0m"

      - name: ❌ Failure summary
        if: failure()
        run: |
          {
            echo "## ❌ Deploy failed"
            echo ""
            echo "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
