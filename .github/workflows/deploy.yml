name: deploy
run-name: deploy ${{ inputs.repo }} @ ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repo, e.g. wlgdev/mybot'
        required: true
        type: string
      sha:
        description: 'Full 40-char commit SHA to deploy'
        required: true
        type: string
      docker_compose_path:
        description: 'Compose file path inside the source repo'
        required: false
        default: 'docker-compose.yml'
        type: string
      is_dev:
        description: 'true = separate -dev stack, false = prod stack'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      env:
        description: 'Extra KEY=VALUE lines, exported for docker compose at deploy time (not stored on server)'
        required: false
        default: ''
        type: string
      target:
        description: 'Traefik routing: SUBDOMAIN:SERVICE:PORT lines'
        required: false
        default: ''
        type: string
      monitor:
        description: "'true' = attach services to monitor network and inject OTLP_ENDPOINT"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      monitor_network:
        description: 'External Docker network of the monitor stack'
        required: false
        default: 'monitor_default'
        type: string
      monitor_endpoint:
        description: 'OTLP HTTP endpoint injected as OTLP_ENDPOINT'
        required: false
        default: 'otel-collector:4318'
        type: string

concurrency:
  group: deploy-${{ inputs.repo }}-${{ inputs.is_dev }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Validate inputs
        env:
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          COMPOSE_PATH: ${{ inputs.docker_compose_path }}
          IS_DEV: ${{ inputs.is_dev }}
          TARGET: ${{ inputs.target }}
          MONITOR: ${{ inputs.monitor }}
          MONITOR_NETWORK: ${{ inputs.monitor_network }}
          MONITOR_ENDPOINT: ${{ inputs.monitor_endpoint }}
          ENV_INPUT: ${{ inputs.env }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -eu

          # --- repo, app name, sha, compose path ---
          case "$REPO" in wlgdev/*) ;; *) echo "::error::repo must be in wlgdev org"; exit 1;; esac
          APP="${REPO#wlgdev/}"
          case "$APP" in ''|*[!a-z0-9-]*) echo "::error::bad app name"; exit 1;; esac
          case "$SHA" in *[!0-9a-f]*|'') echo "::error::sha must be hex"; exit 1;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::sha must be full 40-char"; exit 1; }
          case "$COMPOSE_PATH" in ''|*..*|/*) echo "::error::bad docker_compose_path"; exit 1;; esac
          case "$IS_DEV" in true|false) ;; *) echo "::error::is_dev must be true/false"; exit 1;; esac
          case "$MONITOR" in true|false) ;; *) echo "::error::monitor must be true/false"; exit 1;; esac

          # --- monitor network + endpoint (only when monitor is on) ---
          if [ "$MONITOR" = "true" ]; then
            case "$MONITOR_NETWORK" in ''|*[!a-zA-Z0-9_-]*) echo "::error::bad monitor_network"; exit 1;; esac
            case "$MONITOR_ENDPOINT" in *:*) ;; *) echo "::error::monitor_endpoint must be host:port"; exit 1;; esac
            case "$MONITOR_ENDPOINT" in *[!a-zA-Z0-9.:\_-]*) echo "::error::bad characters in monitor_endpoint"; exit 1;; esac
            MON_EP_PORT="${MONITOR_ENDPOINT##*:}"
            case "$MON_EP_PORT" in *[!0-9]*|'') echo "::error::monitor_endpoint port must be numeric"; exit 1;; esac
            if [ "$MON_EP_PORT" -lt 1 ] || [ "$MON_EP_PORT" -gt 65535 ]; then
              echo "::error::monitor_endpoint port out of range: $MON_EP_PORT"; exit 1
            fi
          fi

          # --- target lines: SUBDOMAIN:SERVICE:PORT ---
          if [ -n "$TARGET" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              case "$line" in
                *[!a-zA-Z0-9.:_-]*) echo "::error::bad characters in target: $line"; exit 1 ;;
              esac
              IFS=':' read -r t_domain t_service t_port extra <<< "$line"
              [ -n "$extra" ] && { echo "::error::target must have format SUBDOMAIN:SERVICE:PORT"; exit 1; }
              [ -n "$t_domain" ] && [ -n "$t_service" ] && [ -n "$t_port" ] || { echo "::error::invalid target line: $line"; exit 1; }
              case "$t_domain" in *[!a-zA-Z0-9.-]*|'') echo "::error::bad subdomain in target: $t_domain"; exit 1 ;; esac
              case "$t_service" in *[!a-zA-Z0-9_-]*|'') echo "::error::bad service name in target: $t_service"; exit 1 ;; esac
              case "$t_port" in *[!0-9]*|'') echo "::error::port must be numeric: $t_port"; exit 1 ;; esac
              if [ "$t_port" -lt 1 ] || [ "$t_port" -gt 65535 ]; then
                echo "::error::port out of range: $t_port"; exit 1
              fi
            done <<< "$TARGET"
          fi

          [ "$IS_DEV" = "true" ] && APP="$APP-dev"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo -e "\033[1;32m✅ inputs OK → stack: $APP, commit: ${SHA:0:7}\033[0m"

          # --- summary: what is being deployed ---
          IMG_NAME="$(printf '%s' "$ENV_INPUT" | grep '^SERVICE_IMAGE_NAME=' | head -1 | cut -d= -f2- || true)"
          IMG_TAG="$(printf '%s' "$ENV_INPUT" | grep '^SERVICE_IMAGE_TAG=' | head -1 | cut -d= -f2- || true)"
          IMAGE="${IMG_NAME:-—}:${IMG_TAG:-—}"
          if [ -z "$TARGET" ]; then
            ROUTES="— (headless)"
          else
            case "$IS_DEV" in true) SUFFIX="dev.wlg.tv";; *) SUFFIX="wlg.tv";; esac
            ROUTES="$(while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              sub="${line%%:*}"
              sub="${sub%.dev.wlg.tv}"
              sub="${sub%.wlg.tv}"
              printf 'https://%s.%s<br>' "$sub" "$SUFFIX"
            done <<< "$TARGET")"
          fi
          if [ "$MONITOR" = "true" ]; then
            MONITOR_TXT="\`$MONITOR_NETWORK → $MONITOR_ENDPOINT\`"
          else
            MONITOR_TXT="— (off)"
          fi
          {
            echo "## 🚀 Deploy \`$REPO\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Stack | \`$APP\` |"
            echo "| Commit | [\`${SHA:0:7}\`]($SERVER_URL/$REPO/commit/$SHA) |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Routes | $ROUTES |"
            echo "| Monitor | $MONITOR_TXT |"
            echo "| Path | \`/data/apps/$APP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.ORG_READ_PAT }}
          path: app

      - name: 🌐 Generate compose override
        if: ${{ inputs.target != '' || inputs.monitor == 'true' }}
        env:
          APP: ${{ env.APP }}
          IS_DEV: ${{ inputs.is_dev }}
          TARGET: ${{ inputs.target }}
          MONITOR: ${{ inputs.monitor }}
          MONITOR_NETWORK: ${{ inputs.monitor_network }}
          MONITOR_ENDPOINT: ${{ inputs.monitor_endpoint }}
          COMPOSE_PATH: ${{ inputs.docker_compose_path }}
        run: |
          set -eu

          # --- pyyaml for reading service names out of the caller compose ---
          python3 -c "import yaml" 2>/dev/null || pip install -q pyyaml

          # --- build docker-compose.override.yml from target lines + monitor block ---
          python3 - << 'EOF'
          import os, sys
          import yaml

          target = os.environ.get("TARGET", "").strip()
          monitor = os.environ.get("MONITOR") == "true"

          app = os.environ["APP"]
          is_dev = os.environ.get("IS_DEV") == "true"
          domain_suffix = "dev.wlg.tv" if is_dev else "wlg.tv"
          network_name = f"proxy-{app}-network"

          networks = []      # external net names, in order
          svc_nets = {}      # service -> [extra nets]
          svc_labels = {}    # service -> [label strings]
          svc_env = {}       # service -> [KEY=VALUE strings]

          def attach(service, net):
              if net not in networks:
                  networks.append(net)
              svc_nets.setdefault(service, [])
              if net not in svc_nets[service]:
                  svc_nets[service].append(net)

          for line in target.splitlines():
              line = line.strip()
              if not line:
                  continue
              parts = line.split(":")
              if len(parts) != 3:
                  sys.exit(f"Invalid target entry: {line}")
              subdomain, service, port = parts
              subdomain = subdomain.removesuffix(".dev.wlg.tv").removesuffix(".wlg.tv")
              host = f"{subdomain}.{domain_suffix}"
              route = f"{app}-{service}"
              attach(service, network_name)
              svc_labels.setdefault(service, []).extend([
                  "traefik.enable=true",
                  f"traefik.http.services.{route}.loadbalancer.server.port={port}",
                  f"traefik.http.routers.{route}.rule=Host(`{host}`)",
                  f"traefik.http.routers.{route}.tls=true",
                  f"traefik.http.routers.{route}.tls.certresolver=letsencrypt",
                  f"traefik.http.routers.{route}.entrypoints=websecure",
                  f"traefik.http.routers.{route}-http.rule=Host(`{host}`)",
                  f"traefik.http.routers.{route}-http.entrypoints=web",
                  f"traefik.http.routers.{route}-http.middlewares={route}-https",
                  f"traefik.http.middlewares.{route}-https.redirectscheme.scheme=https",
                  f"traefik.http.middlewares.{route}-https.redirectscheme.permanent=true",
                  f"traefik.docker.network={network_name}",
              ])

          if monitor:
              mnet = os.environ["MONITOR_NETWORK"]
              mep = os.environ["MONITOR_ENDPOINT"]
              with open(os.path.join("app", os.environ["COMPOSE_PATH"]), encoding="utf-8") as f:
                  base = yaml.safe_load(f) or {}
              names = list((base.get("services") or {}).keys())
              if not names:
                  sys.exit("monitor is on but no services found in compose")
              for service in names:
                  attach(service, mnet)
                  svc_env.setdefault(service, []).append(f"OTLP_ENDPOINT={mep}")

          def emit(path, with_monitor):
              mnet = os.environ.get("MONITOR_NETWORK", "")
              nets = [n for n in networks if with_monitor or n != mnet]
              lines = ["networks:"]
              for net in nets:
                  lines += [f"  {net}:", "    external: true"]
              lines += ["services:"]
              any_svc = False
              for service, extra in svc_nets.items():
                  extra = [n for n in extra if with_monitor or n != mnet]
                  labels = svc_labels.get(service, [])
                  envs = svc_env.get(service, []) if with_monitor else []
                  if not extra and not labels and not envs:
                      continue
                  any_svc = True
                  lines += [f"  {service}:", "    networks:", "      - default"]
                  lines += [f"      - {n}" for n in extra]
                  if labels:
                      lines += ["    labels:"] + [f"      - \"{l}\"" for l in labels]
                  if envs:
                      lines += ["    environment:"] + [f"      - {e}" for e in envs]
              with open(path, "w", encoding="utf-8") as f:
                  if nets or any_svc:
                      f.write("\n".join(lines) + "\n")

          emit("docker-compose.override.yml", True)
          if monitor:
              # traefik-only fallback for when the monitor network is missing on the server
              emit("docker-compose.override.fallback.yml", False)
          EOF
          echo "📄 docker-compose.override.yml generated"

          # --- merged files must parse before they reach the server ---
          if [ "$MONITOR" = "true" ]; then
            docker compose -f "app/$COMPOSE_PATH" -f docker-compose.override.yml config -q \
              || { echo "::error::merged compose is invalid (monitor block)"; exit 1; }
            echo "✅ merged compose OK"
          fi

      - name: 🚀 Deploy stack over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          COMPOSE_PATH: ${{ inputs.docker_compose_path }}
          ENV_INPUT: ${{ inputs.env }}
          MONITOR: ${{ inputs.monitor }}
          MONITOR_NETWORK: ${{ inputs.monitor_network }}
        run: |
          set -eu

          # --- ssh setup ---
          test -f "app/$COMPOSE_PATH" || { echo "::error::compose not found: $COMPOSE_PATH"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : "${SSH_USER:=deploy}"
          : "${SSH_PORT:=22}"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          REMOTE="$SSH_USER@$SSH_HOST"

          # --- override pick: full monitor variant, or traefik-only fallback ---
          # (a missing monitor network must never block the app deploy)
          OVERRIDE_SRC=""
          if [ -f docker-compose.override.yml ]; then OVERRIDE_SRC="docker-compose.override.yml"; fi
          if [ "$MONITOR" = "true" ]; then
            if $SSH "$REMOTE" "docker network inspect \"$MONITOR_NETWORK\" >/dev/null 2>&1"; then
              echo "📡 monitor network $MONITOR_NETWORK OK"
            else
              echo "::warning::monitor network $MONITOR_NETWORK not found — deploying without monitor attachment"
              {
                echo ""
                echo "### ⚠️ Monitor skipped"
                echo "Network \`$MONITOR_NETWORK\` not found on server — stack is up without OTLP attachment."
              } >> "$GITHUB_STEP_SUMMARY"
              OVERRIDE_SRC=""
              if [ -s docker-compose.override.fallback.yml ]; then OVERRIDE_SRC="docker-compose.override.fallback.yml"; fi
            fi
          fi

          # --- upload: compose (+ override) and secrets ---
          $SSH "$REMOTE" "mkdir -p /data/apps/$APP"
          scp -P "$SSH_PORT" -i ~/.ssh/deploy_key "app/$COMPOSE_PATH" "$REMOTE:/data/apps/$APP/docker-compose.yml.new"
          if [ -n "$OVERRIDE_SRC" ]; then
            scp -P "$SSH_PORT" -i ~/.ssh/deploy_key "$OVERRIDE_SRC" "$REMOTE:/data/apps/$APP/docker-compose.override.yml.new"
          fi
          if [ -n "$ENV_INPUT" ]; then
            printf '%s' "$ENV_INPUT" | $SSH "$REMOTE" "cat > /data/apps/$APP/.env.tmp && chmod 600 /data/apps/$APP/.env.tmp"
          fi
          echo "📄 compose uploaded → /data/apps/$APP/docker-compose.yml"

          # --- swap files, export secrets, (re)start the stack ---
          # ponytail: secrets live only in this session env, never on disk (values must not contain newlines)
          $SSH "$REMOTE" "cd /data/apps/$APP \
            && rm -f .env \
            && mv docker-compose.yml.new docker-compose.yml \
            && if [ -f docker-compose.override.yml.new ]; then mv docker-compose.override.yml.new docker-compose.override.yml; else rm -f docker-compose.override.yml; fi \
            && if [ -f .env.tmp ]; then while IFS='=' read -r k v || [ -n \"\$k\" ]; do case \"\$k\" in ''|\#*) ;; *) export \"\$k=\$v\";; esac; done < .env.tmp; rm -f .env.tmp; fi \
            && if [ -f docker-compose.override.yml ]; then (docker network inspect \"proxy-$APP-network\" >/dev/null 2>&1 || docker network create \"proxy-$APP-network\"); fi \
            && docker compose pull \
            && docker compose up -d --remove-orphans"

          # --- traefik network: attach proxy, or detach + remove when headless ---
          # (runs after up, so removal finds no attached app containers — no orphans)
          $SSH "$REMOTE" "cd /data/apps/$APP \
            && if [ -f docker-compose.override.yml ]; then \
              (docker network inspect \"proxy-$APP-network\" >/dev/null 2>&1 || docker network create \"proxy-$APP-network\") \
              && if docker ps --format '{{.Names}}' | grep -qx coolify-proxy; then \
                docker inspect -f '{{json .NetworkSettings.Networks}}' coolify-proxy | grep -q \"\\\"proxy-$APP-network\\\"\" \
                || docker network connect \"proxy-$APP-network\" coolify-proxy; \
              fi; \
            else \
              if docker network inspect \"proxy-$APP-network\" >/dev/null 2>&1; then \
                docker network disconnect \"proxy-$APP-network\" coolify-proxy 2>/dev/null || true; \
                docker network rm \"proxy-$APP-network\"; \
              fi; \
            fi"

          # --- drop old images, show + record status ---
          $SSH "$REMOTE" "cd /data/apps/$APP \
            && docker image prune -f \
            && docker image prune -a -f --filter \"until=168h\""
          PS_OUT="$($SSH "$REMOTE" "cd /data/apps/$APP && docker compose ps")"
          echo "$PS_OUT"
          {
            echo ""
            echo "### ✅ Stack is up"
            echo '```'
            echo "$PS_OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo -e "\033[1;32m✅ $APP is up\033[0m"

      - name: ❌ Failure summary
        if: failure()
        run: |
          {
            echo "## ❌ Deploy failed"
            echo ""
            echo "[Open logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
