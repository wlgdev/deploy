name: deploy
run-name: deploy ${{ inputs.repo }} @ ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repo, e.g. wlgdev/mybot'
        required: true
        type: string
      sha:
        description: 'Full 40-char commit SHA to deploy'
        required: true
        type: string
      docker_compose_path:
        description: 'Compose file path inside the source repo'
        required: false
        default: 'docker-compose.yml'
        type: string
      is_dev:
        description: 'true = separate -dev stack, false = prod stack'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      env:
        description: 'Extra KEY=VALUE lines, exported for docker compose at deploy time (not stored on server)'
        required: false
        default: ''
        type: string
      target:
        description: 'Nginx Proxy Manager routing: SUBDOMAIN:SERVICE:PORT lines'
        required: false
        default: ''
        type: string


concurrency:
  group: deploy-${{ inputs.repo }}-${{ inputs.is_dev }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Mask env values
        env:
          ENV_INPUT: ${{ inputs.env }}
        run: |
          set -eu

          # env приходит обычным input-ом workflow_dispatch, а не секретом — GitHub не маскирует
          # его значения в логах центрального репозитория. Регистрируем их как маскируемые:
          # дальше по логу они видны как ***
          while IFS='=' read -r k v || [ -n "$k" ]; do
            case "$k" in ''|\#*) ;; *) [ -n "$v" ] && echo "::add-mask::$v";; esac
          done <<< "$ENV_INPUT"

      - name: 🔍 Validate inputs
        env:
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          COMPOSE_PATH: ${{ inputs.docker_compose_path }}
          IS_DEV: ${{ inputs.is_dev }}
          TARGET: ${{ inputs.target }}
          ENV_INPUT: ${{ inputs.env }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -eu

          # --- repo, app name, sha, compose path ---
          case "$REPO" in wlgdev/*) ;; *) echo "::error::repo must be in wlgdev org"; exit 1;; esac
          APP="${REPO#wlgdev/}"
          case "$APP" in ''|*[!a-z0-9-]*) echo "::error::bad app name"; exit 1;; esac
          case "$SHA" in *[!0-9a-f]*|'') echo "::error::sha must be hex"; exit 1;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::sha must be full 40-char"; exit 1; }
          case "$COMPOSE_PATH" in ''|*..*|/*) echo "::error::bad docker_compose_path"; exit 1;; esac
          case "$IS_DEV" in true|false) ;; *) echo "::error::is_dev must be true/false"; exit 1;; esac
          # --- target lines: SUBDOMAIN:SERVICE:PORT ---
          if [ -n "$TARGET" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              case "$line" in
                *[!a-zA-Z0-9.:_-]*) echo "::error::bad characters in target: $line"; exit 1 ;;
              esac
              IFS=':' read -r t_domain t_service t_port extra <<< "$line"
              [ -n "$extra" ] && { echo "::error::target must have format SUBDOMAIN:SERVICE:PORT"; exit 1; }
              [ -n "$t_domain" ] && [ -n "$t_service" ] && [ -n "$t_port" ] || { echo "::error::invalid target line: $line"; exit 1; }
              case "$t_domain" in *[!a-zA-Z0-9.-]*|'') echo "::error::bad subdomain in target: $t_domain"; exit 1 ;; esac
              case "$t_service" in *[!a-zA-Z0-9_-]*|'') echo "::error::bad service name in target: $t_service"; exit 1 ;; esac
              case "$t_port" in *[!0-9]*|'') echo "::error::port must be numeric: $t_port"; exit 1 ;; esac
              if [ "$t_port" -lt 1 ] || [ "$t_port" -gt 65535 ]; then
                echo "::error::port out of range: $t_port"; exit 1
              fi
            done <<< "$TARGET"
          fi

          # --- stack name (dir, compose project, container prefix) and its own network ---
          if [ "$IS_DEV" = "true" ]; then
            STACK_NETWORK="proxy-dev-${APP}-network"
            APP="${APP}-dev"
          else
            STACK_NETWORK="proxy-${APP}-network"
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "STACK_NETWORK=$STACK_NETWORK" >> "$GITHUB_ENV"
          echo -e "\033[1;32m✅ inputs OK → stack: $APP, commit: ${SHA:0:7}\033[0m"

          # --- summary: what is being deployed ---
          IMG_NAME="$(printf '%s' "$ENV_INPUT" | grep '^SERVICE_IMAGE_NAME=' | head -1 | cut -d= -f2- || true)"
          IMG_TAG="$(printf '%s' "$ENV_INPUT" | grep '^SERVICE_IMAGE_TAG=' | head -1 | cut -d= -f2- || true)"
          IMAGE="${IMG_NAME:-—}:${IMG_TAG:-—}"
          if [ -z "$TARGET" ]; then
            ROUTES="— (headless)"
          else
            case "$IS_DEV" in true) SUFFIX="dev.wlg.tv";; *) SUFFIX="wlg.tv";; esac
            ROUTES="$(while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              sub="${line%%:*}"
              sub="${sub%.dev.wlg.tv}"
              sub="${sub%.wlg.tv}"
              printf 'https://%s.%s<br>' "$sub" "$SUFFIX"
            done <<< "$TARGET")"
          fi
          {
            echo "## 🚀 Deploy \`$REPO\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Stack | \`$APP\` |"
            echo "| Network | \`$STACK_NETWORK\` |"
            echo "| Commit | [\`${SHA:0:7}\`]($SERVER_URL/$REPO/commit/$SHA) |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Routes | $ROUTES |"
            echo "| Path | \`/data/apps/$APP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.ORG_READ_PAT }}
          path: app

      - name: 🌐 Generate compose override
        env:
          APP: ${{ env.APP }}
          STACK_NETWORK: ${{ env.STACK_NETWORK }}
          TARGET: ${{ inputs.target }}
          COMPOSE_PATH: ${{ inputs.docker_compose_path }}
          ENV_INPUT: ${{ inputs.env }}
          REPO: ${{ inputs.repo }}
          IS_DEV: ${{ inputs.is_dev }}
        run: |
          set -eu

          # --- pyyaml for reading the caller compose ---
          python3 -c "import yaml" 2>/dev/null || pip install -q pyyaml

          # --- build docker-compose.override.yml: log labels, stack network + aliases, port reset ---
          python3 - << 'EOF'
          import os, re, sys
          import yaml

          class Loader(yaml.SafeLoader):
              pass
          Loader.add_multi_constructor("!", lambda loader, suffix, node: None)

          target = os.environ.get("TARGET", "").strip()
          app = os.environ["APP"]
          repo = os.environ["REPO"]
          is_dev = os.environ.get("IS_DEV") == "true"
          stack_network = os.environ["STACK_NETWORK"]

          env = {}
          for line in os.environ.get("ENV_INPUT", "").splitlines():
              k, sep, v = line.partition("=")
              if sep and k.strip():
                  env[k.strip()] = v

          with open(os.path.join("app", os.environ["COMPOSE_PATH"]), encoding="utf-8") as f:
              base = yaml.load(f, Loader=Loader) or {}

          services = base.get("services") or {}
          if not services:
              sys.exit("no services found in compose")

          base_app = repo.split("/", maxsplit=1)[-1]
          env_name = "dev" if is_dev else "prod"
          log_labels = "app,env,service,repo,image,version"

          def subst(text):
              def repl(m):
                  key = m.group(1) or m.group(2)
                  return env.get(key, m.group(0))
              return re.sub(r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}|\$([A-Za-z_][A-Za-z0-9_]*)", repl, text)

          def split_image(ref):
              colon, slash = ref.rfind(":"), ref.rfind("/")
              if colon > slash:
                  return ref[:colon], ref[colon + 1:]
              return ref, ""

          def service_image(spec):
              raw = (spec or {}).get("image")
              resolved = subst(str(raw)) if raw else ""
              if not resolved or "${" in resolved:
                  return env.get("SERVICE_IMAGE_NAME", ""), env.get("SERVICE_IMAGE_TAG", "")
              return split_image(resolved)

          nets = []      # external net names, in order
          svc = {}       # service -> {nets, aliases, labels, reset}

          def svc_entry(service):
              if service in svc:
                  return svc[service]
              spec = services.get(service) or {}
              user_labels = spec.get("labels") or {}
              if isinstance(user_labels, list):
                  user_labels = {x.split("=", 1)[0]: x.split("=", 1)[1] for x in user_labels}
              image, version = service_image(spec)
              user_labels.update({"app": base_app, "env": env_name, "service": service,
                                  "repo": repo, "image": image, "version": version})
              e = {"nets": [], "aliases": [], "labels": user_labels, "reset": bool(spec.get("ports"))}
              svc[service] = e
              return e

          def attach(service, net):
              e = svc_entry(service)
              if net not in nets:
                  nets.append(net)
              if net not in e["nets"]:
                  e["nets"].append(net)

          for service in services:
              svc_entry(service)

          for line in target.splitlines():
              line = line.strip()
              if not line:
                  continue
              parts = line.split(":")
              if len(parts) != 3:
                  sys.exit(f"Invalid target entry: {line}")
              subdomain, service, port = parts
              subdomain = subdomain.removesuffix(".dev.wlg.tv").removesuffix(".wlg.tv")
              attach(service, stack_network)
              alias = f"{app}-{service}"
              aliases = svc_entry(service)["aliases"]
              if alias not in aliases:
                  aliases.append(alias)

          def emit(path):
              lines = []
              if nets:
                  lines.append("networks:")
                  for net in nets:
                      lines += [f"  {net}:", "    external: true"]
                  lines.append("")
              lines.append("services:")
              for service, e in svc.items():
                  lines.append(f"  {service}:")
                  lines.append("    labels:")
                  for k, v in e["labels"].items():
                      lines.append(f'      {k}: "{v}"')
                  lines.append("    logging:")
                  lines.append("      options:")
                  lines.append(f'        labels: "{log_labels}"')
                  if e["nets"]:
                      lines.append("    networks:")
                      for n in e["nets"]:
                          lines.append(f"      {n}:")
                          if n == stack_network and e["aliases"]:
                              lines.append("        aliases:")
                              lines += [f'          - "{a}"' for a in e["aliases"]]
                  if e["reset"]:
                      lines.append("    ports: !reset []")
              with open(path, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          emit("docker-compose.override.yml")
          EOF
          echo "📄 docker-compose.override.yml generated"

          # --- nothing to override: drop the file, an empty one is not a valid compose document ---
          if [ ! -s docker-compose.override.yml ]; then rm -f docker-compose.override.yml; fi

          # --- merged files must parse before they reach the server ---
          # compose may declare required variables (${VAR:?message}); they arrive with the env
          # input and are only set on the server at deploy time, so export them here as well
          if [ -f docker-compose.override.yml ]; then
            while IFS='=' read -r k v || [ -n "$k" ]; do
              case "$k" in ''|\#*) ;; *) export "$k=$v";; esac
            done <<< "$ENV_INPUT"
            export SERVICE_IMAGE_NAME="${SERVICE_IMAGE_NAME:-placeholder}"
            export SERVICE_IMAGE_TAG="${SERVICE_IMAGE_TAG:-placeholder}"
            docker compose -f "app/$COMPOSE_PATH" -f docker-compose.override.yml config -q \
              || { echo "::error::merged compose is invalid"; exit 1; }
            echo "✅ merged compose OK"
          fi

      - name: 🚀 Deploy stack over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          COMPOSE_PATH: ${{ inputs.docker_compose_path }}
          ENV_INPUT: ${{ inputs.env }}
          TARGET: ${{ inputs.target }}
          STACK_NETWORK: ${{ env.STACK_NETWORK }}
        run: |
          set -eu

          # --- ssh setup ---
          test -f "app/$COMPOSE_PATH" || { echo "::error::compose not found: $COMPOSE_PATH"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : "${SSH_USER:=deploy}"
          : "${SSH_PORT:=22}"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          REMOTE="$SSH_USER@$SSH_HOST"

          # --- override: log labels (+proxy network when target is set) ---
          OVERRIDE_SRC=""
          if [ -f docker-compose.override.yml ]; then OVERRIDE_SRC="docker-compose.override.yml"; fi

          # --- upload: compose (+ override) and secrets ---
          $SSH "$REMOTE" "mkdir -p /data/apps/$APP" \
            || { echo "::error::cannot create /data/apps/$APP as $SSH_USER — /data/apps must exist and be owned by $SSH_USER"; exit 1; }
          scp -P "$SSH_PORT" -i ~/.ssh/deploy_key "app/$COMPOSE_PATH" "$REMOTE:/data/apps/$APP/docker-compose.yml.new"
          if [ -n "$OVERRIDE_SRC" ]; then
            scp -P "$SSH_PORT" -i ~/.ssh/deploy_key "$OVERRIDE_SRC" "$REMOTE:/data/apps/$APP/docker-compose.override.yml.new"
          fi
          if [ -n "$ENV_INPUT" ]; then
            printf '%s' "$ENV_INPUT" | $SSH "$REMOTE" "cat > /data/apps/$APP/.env.tmp && chmod 600 /data/apps/$APP/.env.tmp"
          fi
          echo "📄 compose uploaded → /data/apps/$APP/docker-compose.yml"

          # --- swap files, export secrets, (re)start the stack ---
          HAS_TARGET=no
          if [ -n "$TARGET" ]; then HAS_TARGET=yes; fi
          $SSH "$REMOTE" "APP='$APP' NET='$STACK_NETWORK' HAS_TARGET='$HAS_TARGET' bash -s" <<'REMOTE_SCRIPT'
          set -eu

          cd "/data/apps/$APP"

          npm_container() {
            docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($2) ~ /nginx-proxy-manager/ {print $1; exit}'
          }

          # --- preflight: routing needs the proxy container, port reset needs compose >= 2.24 ---
          if [ "$HAS_TARGET" = "yes" ]; then
            NPM="$(npm_container)"
            [ -n "$NPM" ] || { echo "::error::NPM container not found on the server — routing needs it"; exit 1; }
          fi
          if grep -q '!reset' docker-compose.override.yml.new 2>/dev/null; then
            COMPOSE_V="$(docker compose version --short | sed 's/^v//' | awk -F. '{print $1*100+$2}')"
            [ "$COMPOSE_V" -ge 224 ] || { echo "::error::server compose $COMPOSE_V is too old (need >= 2.24)"; exit 1; }
          fi

          # ponytail: secrets live only in this session env, never on disk (values must not contain newlines)
          rm -f .env
          mv docker-compose.yml.new docker-compose.yml
          if [ -f docker-compose.override.yml.new ]; then
            mv docker-compose.override.yml.new docker-compose.override.yml
          else
            rm -f docker-compose.override.yml
          fi
          if [ -f .env.tmp ]; then
            while IFS='=' read -r k v || [ -n "$k" ]; do
              case "$k" in ''|\#*) ;; *) export "$k=$v";; esac
            done < .env.tmp
            rm -f .env.tmp
          fi

          # --- containers of a foreign compose project under the same name prefix: leftovers, not ours ---
          docker ps -a --filter "name=^${APP}-" --format '{{.ID}} {{.Label "com.docker.compose.project"}}' \
            | awk -v p="$APP" '$2 != p && index($2, p "-") != 1 {print $1}' | xargs -r docker rm -f

          # --- the stack network: only the proxy and the target services live in it ---
          if [ "$HAS_TARGET" = "yes" ]; then
            docker network inspect "$NET" >/dev/null 2>&1 || docker network create "$NET"
            docker inspect -f '{{json .NetworkSettings.Networks}}' "$NPM" | grep -q "\"$NET\"" || docker network connect "$NET" "$NPM"
            echo "🔗 network $NET ready"
          fi

          docker compose pull
          docker compose up -d --remove-orphans

          # --- headless stack: the proxy has no business inside the stack network ---
          if [ "$HAS_TARGET" != "yes" ] && docker network inspect "$NET" >/dev/null 2>&1; then
            NPM="$(npm_container)"
            if [ -n "$NPM" ]; then
              docker network disconnect "$NET" "$NPM" 2>/dev/null || true
            fi
            docker network rm "$NET" 2>/dev/null || true
          fi
          REMOTE_SCRIPT

          # --- drop old images, show + record status ---
          $SSH "$REMOTE" "cd /data/apps/$APP \
            && docker image prune -f \
            && docker image prune -a -f --filter \"until=168h\""
          # --- status via docker labels: compose ps would re-interpolate the file and need the vars ---
          PS_OUT="$($SSH "$REMOTE" "docker ps -a --filter label=com.docker.compose.project=$APP --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'")"
          echo "$PS_OUT"
          {
            echo ""
            echo "### ✅ Stack is up"
            echo '```'
            echo "$PS_OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo -e "\033[1;32m✅ $APP is up\033[0m"

      - name: 🌐 Sync Nginx Proxy Manager
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          APP: ${{ env.APP }}
          IS_DEV: ${{ inputs.is_dev }}
          TARGET: ${{ inputs.target }}
        run: |
          set -eu

          # --- ssh setup ---
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : "${SSH_USER:=deploy}"
          : "${SSH_PORT:=22}"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          REMOTE="$SSH_USER@$SSH_HOST"

          # --- no credentials and nothing managed yet: routing is simply off, stay quiet ---
          HAS_CONF="$($SSH "$REMOTE" 'test -s ~/wlgdev/npm-api.conf && echo yes || echo no')"
          HAS_STATE="$($SSH "$REMOTE" "test -s /data/apps/$APP/.npm-hosts && echo yes || echo no")"
          if [ "$HAS_CONF" != "yes" ] && [ "$HAS_STATE" != "yes" ]; then
            echo "::notice::no Nginx Proxy Manager credentials on the server — proxy hosts are not managed"
            exit 0
          fi
          if [ "$HAS_CONF" != "yes" ]; then
            echo "::error::~/wlgdev/npm-api.conf is missing on the server, but this stack owns proxy hosts"
            exit 1
          fi

          TARGET_B64="$(printf '%s' "$TARGET" | base64 -w0)"
          $SSH "$REMOTE" "APP='$APP' IS_DEV='$IS_DEV' TARGET_B64='$TARGET_B64' bash -s" <<'REMOTE_SCRIPT'
          set -eu

          NPM_DIR="$HOME/wlgdev"
          NPM="$NPM_DIR/npm-api.sh"
          STATE="/data/apps/$APP/.npm-hosts"
          mkdir -p "/data/apps/$APP"
          NPM_URL='https://raw.githubusercontent.com/Erreur32/nginx-proxy-manager-Bash-API/main/npm-api.sh'

          if [ ! -x "$NPM" ]; then
            mkdir -p "$NPM_DIR"
            curl -fsSL -o "$NPM" "$NPM_URL"
            chmod +x "$NPM"
            echo "⬇️  npm-api.sh downloaded to $NPM"
          fi

          SUFFIX='wlg.tv'
          if [ "$IS_DEV" = 'true' ]; then SUFFIX='dev.wlg.tv'; fi

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          DESIRED="$WORK/desired"
          NEXT="$WORK/next"
          HOSTS="$WORK/hosts.json"
          : > "$DESIRED"

          # --- desired state: <domain>\t<dns alias>\t<port> ---
          printf '%s' "$TARGET_B64" | base64 -d | while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            sub="${line%%:*}"
            rest="${line#*:}"
            svc="${rest%%:*}"
            port="${rest##*:}"
            sub="${sub%.dev.wlg.tv}"
            sub="${sub%.wlg.tv}"
            printf '%s\t%s\t%s\n' "$sub.$SUFFIX" "$APP-$svc" "$port" >> "$DESIRED"
          done

          # --- the CLI may print token banners before the payload, so cut to the JSON array ---
          npm_json() {
            "$NPM" "$@" --json | awk 'started || /^[[:space:]]*\[/ { started = 1; print }'
          }
          host_field() {
            jq -r --arg d "$1" --arg f "$2" 'first(.[] | select(.domain_names | index($d)) | .[$f]) // empty' "$HOSTS"
          }

          npm_json --host-list > "$HOSTS"

          while IFS=$(printf '\t') read -r domain alias port; do
            [ -z "$domain" ] && continue
            id="$(host_field "$domain" id)"
            if [ -z "$id" ]; then
              echo "➕ $domain → $alias:$port (хост + сертификат)"
              "$NPM" --host-create "$domain" -i "$alias" -p "$port" --cert-generate "$domain" --host-ssl-enable -y
              continue
            fi
            cur_host="$(host_field "$domain" forward_host)"
            cur_port="$(host_field "$domain" forward_port)"
            if [ "$cur_host" != "$alias" ]; then
              echo "🔁 $domain: forward_host $cur_host → $alias"
              "$NPM" --host-update "$id" "forward_host=$alias"
            fi
            if [ "$cur_port" != "$port" ]; then
              echo "🔁 $domain: forward_port $cur_port → $port"
              "$NPM" --host-update "$id" "forward_port=$port"
            fi
            cert="$(host_field "$domain" certificate_id)"
            if [ -z "$cert" ] || [ "$cert" = '0' ]; then
              echo "🔐 $domain: выпускаем сертификат"
              "$NPM" --cert-generate "$domain" -y
              cert_id="$(npm_json --cert-list | jq -r --arg d "$domain" 'first(.[] | select(.domain_names | index($d)) | .id) // empty')"
              "$NPM" --host-ssl-enable "$id" "$cert_id"
            fi
          done < "$DESIRED"

          # --- refresh, record what we own, drop hosts the stack no longer declares ---
          npm_json --host-list > "$HOSTS"
          : > "$NEXT"
          while IFS=$(printf '\t') read -r domain alias port; do
            [ -z "$domain" ] && continue
            id="$(host_field "$domain" id)"
            [ -n "$id" ] && printf '%s %s\n' "$domain" "$id" >> "$NEXT"
          done < "$DESIRED"

          if [ -s "$STATE" ]; then
            while read -r domain id; do
              [ -z "$domain" ] && continue
              if ! awk -v d="$domain" '$1 == d { found = 1 } END { exit !found }' "$NEXT"; then
                echo "🗑️  $domain — больше не в target, удаляем хост"
                "$NPM" --host-delete "$id" -y
              fi
            done < "$STATE"
          fi
          cp "$NEXT" "$STATE"
          REMOTE_SCRIPT

          {
            echo ""
            echo "### 🌐 Nginx Proxy Manager"
            printf '%s\n' "$TARGET" | grep -v '^[[:space:]]*$' | while IFS= read -r line; do
              sub="${line%%:*}"
              case "$IS_DEV" in true) echo "- https://$sub.dev.wlg.tv";; *) echo "- https://$sub.wlg.tv";; esac
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ❌ Failure summary
        if: failure()
        run: |
          {
            echo "## ❌ Deploy failed"
            echo ""
            echo "[Open logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
