name: deploy to wlgdev server
description: Triggers a headless deploy in wlgdev/deploy. Caller repo needs DEPLOY_TRIGGER_PAT secret (fine-grained PAT, Actions write on wlgdev/deploy).

inputs:
  trigger_pat:
    required: true
    description: 'Pass the caller-repo DEPLOY_TRIGGER_PAT secret'
  compose_path:
    required: false
    default: 'docker-compose.yml'
    description: 'Compose file path in the caller repo'
  is_dev:
    required: false
    default: 'true'
    description: "'true' = <app>-dev stack, 'false' = prod <app> stack"
  env:
    required: false
    default: ''
    description: 'KEY=VALUE lines, written to .env next to compose on server'
  central_ref:
    required: false
    default: 'main'
    description: 'Branch of wlgdev/deploy to dispatch (leave default)'

runs:
  using: composite
  steps:
    - run: |
        set -eu
        case "$IS_DEV" in true|false) ;; *) echo "::error::is_dev must be 'true' or 'false'"; exit 1;; esac
        curl -sf -X POST -H "Authorization: Bearer $PAT" -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/wlgdev/deploy/actions/workflows/deploy.yml/dispatches" \
          -d "$(jq -n --arg repo "$REPO" --arg sha "$SHA" --arg compose "$COMPOSE_PATH" \
                        --arg dev "$IS_DEV" --arg env "$ENV_INPUT" --arg ref "$CENTRAL_REF" \
                '{ref:$ref,inputs:{repo:$repo, sha:$sha, compose_path:$compose, is_dev:$dev, env:$env}}')"
        echo "dispatch sent: $REPO @ ${SHA:0:7} (is_dev=$IS_DEV)"
      shell: bash
      env:
        PAT: ${{ inputs.trigger_pat }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        COMPOSE_PATH: ${{ inputs.compose_path }}
        IS_DEV: ${{ inputs.is_dev }}
        ENV_INPUT: ${{ inputs.env }}
        CENTRAL_REF: ${{ inputs.central_ref }}
