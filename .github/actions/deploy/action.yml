name: deploy to wlgdev server
description: Triggers a headless deploy in wlgdev/deploy and waits for its result. Caller repo needs DEPLOY_TRIGGER_PAT secret (fine-grained PAT, Actions write on wlgdev/deploy).

inputs:
  pat:
    required: true
    description: 'Pass the caller-repo DEPLOY_TRIGGER_PAT secret'
  docker_compose_path:
    required: false
    default: 'docker-compose.yml'
    description: 'Compose file path in the caller repo (repo root by default)'
  is_dev:
    required: false
    default: 'true'
    description: "'true' = <app>-dev stack, 'false' = prod <app> stack"
  env:
    required: false
    default: ''
    description: 'KEY=VALUE lines, exported for docker compose at deploy time (not stored on server)'
  central_ref:
    required: false
    default: 'main'
    description: 'Branch of wlgdev/deploy to dispatch (leave default)'

runs:
  using: composite
  steps:
    - run: |
        set -eu
        case "$IS_DEV" in true|false) ;; *) echo "::error::is_dev must be 'true' or 'false'"; exit 1;; esac
        curl -sf -X POST -H "Authorization: Bearer $PAT" -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/wlgdev/deploy/actions/workflows/deploy.yml/dispatches" \
          -d "$(jq -n --arg repo "$REPO" --arg sha "$SHA" --arg compose "$COMPOSE_PATH" \
                        --arg dev "$IS_DEV" --arg env "$ENV_INPUT" --arg ref "$CENTRAL_REF" \
                '{ref:$ref,inputs:{repo:$repo, sha:$sha, docker_compose_path:$compose, is_dev:$dev, env:$env}}')"
        echo "dispatch accepted, waiting for central run: $REPO @ ${SHA:0:7} (is_dev=$IS_DEV)"
        START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        TITLE="deploy $REPO @ $SHA"
        RUN_ID=""
        for i in $(seq 1 40); do
          RUN_ID="$(GH_TOKEN="$PAT" gh api "repos/wlgdev/deploy/actions/workflows/deploy.yml/runs?per_page=20" \
            --jq '.workflow_runs[] | "\(.id) \(.created_at) \(.display_title)"' | grep -F " $TITLE" | awk -v s="$START" '$2 >= s {print $1}' | head -1)"
          if [ -n "$RUN_ID" ]; then echo "found central run $RUN_ID"; break; fi
          echo "waiting for central run to appear... ($i)"
          sleep 15
        done
        [ -n "$RUN_ID" ] || { echo "::error::central deploy run not found within 10m"; exit 1; }
        for i in $(seq 1 40); do
          RESULT="$(GH_TOKEN="$PAT" gh api "repos/wlgdev/deploy/actions/runs/$RUN_ID" --jq '"\(.status)/\(.conclusion)"')"
          echo "central run $RUN_ID: $RESULT — https://github.com/wlgdev/deploy/actions/runs/$RUN_ID"
          case "$RESULT" in
            completed/success) echo "deploy OK"; exit 0;;
            completed/*) echo "::error::central deploy FAILED ($RESULT), logs linked above"; exit 1;;
          esac
          sleep 15
        done
        echo "::error::timed out waiting for central deploy"; exit 1
      shell: bash
      env:
        PAT: ${{ inputs.pat }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        COMPOSE_PATH: ${{ inputs.docker_compose_path }}
        IS_DEV: ${{ inputs.is_dev }}
        ENV_INPUT: ${{ inputs.env }}
        CENTRAL_REF: ${{ inputs.central_ref }}
