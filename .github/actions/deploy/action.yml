name: deploy to wlgdev server
description: Triggers a deploy in wlgdev/deploy (headless, or Traefik-routed when target is set) and waits for its result. Caller repo needs DEPLOY_TRIGGER_PAT secret (fine-grained PAT, Actions write on wlgdev/deploy).

inputs:
  pat:
    required: true
    description: 'Pass the caller-repo DEPLOY_TRIGGER_PAT secret'
  docker_compose_path:
    required: false
    default: 'docker-compose.yml'
    description: 'Compose file path in the caller repo (repo root by default)'
  is_dev:
    required: false
    default: 'true'
    description: "'true' = <app>-dev stack, 'false' = prod <app> stack"
  service_image_name:
    required: false
    default: ''
    description: 'Image repo, default is ghcr.io/wlgdev/<your-repo-name>'
  service_image_tag:
    required: false
    default: ''
    description: 'Image tag, default is the release tag (on release) or the short commit sha'
  env:
    required: false
    default: ''
    description: 'KEY=VALUE lines, exported for docker compose at deploy time (not stored on server)'
  target:
    required: false
    default: ''
    description: 'SUBDOMAIN:SERVICE:PORT lines for Traefik routing (leave empty for headless deploy)'
  central_ref:
    required: false
    default: 'main'
    description: 'Branch of wlgdev/deploy to dispatch (leave default)'

runs:
  using: composite
  steps:
    - name: 🚀 Deploy via wlgdev/deploy
      id: deploy
      run: |
        set -eu

        GREEN='\033[1;32m'; RED='\033[1;31m'; YELLOW='\033[1;33m'; NC='\033[0m'

        # --- sanity ---
        case "$IS_DEV" in true|false) ;; *) echo "::error::is_dev must be 'true' or 'false'"; exit 1;; esac

        # --- image coordinates: explicit inputs win, the rest is derived from the caller repo + event ---
        if [ -z "$IMAGE_NAME_IN" ]; then
          IMAGE_NAME_IN="ghcr.io/wlgdev/$(printf '%s' "${REPO#*/}" | tr '[:upper:]' '[:lower:]')"
        fi
        if [ -z "$IMAGE_TAG_IN" ]; then
          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            IMAGE_TAG_IN="$RELEASE_TAG"
          else
            IMAGE_TAG_IN="$(printf '%s' "$SHA" | cut -c1-7)"
          fi
        fi

        # inputs win over env lines with the same keys
        ENV_PAYLOAD="$(printf '%s' "$ENV_INPUT" | grep -v '^SERVICE_IMAGE_NAME=' | grep -v '^SERVICE_IMAGE_TAG=' || true)"
        ENV_PAYLOAD="$(printf '%s\nSERVICE_IMAGE_NAME=%s\nSERVICE_IMAGE_TAG=%s' "$ENV_PAYLOAD" "$IMAGE_NAME_IN" "$IMAGE_TAG_IN")"
        echo -e "📦 image: ${YELLOW}$IMAGE_NAME_IN:$IMAGE_TAG_IN${NC}"

        # summary inputs (multiline target via heredoc, shown by the 📋 step below)
        echo "WLG_IMAGE=$IMAGE_NAME_IN:$IMAGE_TAG_IN" >> "$GITHUB_ENV"
        echo "WLG_TITLE=deploy $REPO @ $SHA" >> "$GITHUB_ENV"
        if [ -n "$TARGET_IN" ]; then
          echo "WLG_TARGET<<EOF" >> "$GITHUB_ENV"
          printf '%s\n' "$TARGET_IN" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
        fi

        # --- dispatch the central workflow ---
        # START before dispatch: the central run's created_at can predate the curl response
        START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        TITLE="deploy $REPO @ $SHA"
        curl -sf -X POST -H "Authorization: Bearer $PAT" -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/wlgdev/deploy/actions/workflows/deploy.yml/dispatches" \
          -d "$(jq -n --arg repo "$REPO" --arg sha "$SHA" --arg compose "$COMPOSE_PATH" \
                        --arg dev "$IS_DEV" --arg env "$ENV_PAYLOAD" --arg target "$TARGET_IN" --arg ref "$CENTRAL_REF" \
                '{ref:$ref,inputs:{repo:$repo, sha:$sha, docker_compose_path:$compose, is_dev:$dev, env:$env, target:$target}}')"
        echo -e "🚀 dispatch accepted, waiting for central run: $REPO @ ${SHA:0:7} (is_dev=$IS_DEV)"

        # --- wait for the central run to appear ---
        RUN_ID=""
        for i in $(seq 1 40); do
          RUN_ID="$(GH_TOKEN="$PAT" gh api "repos/wlgdev/deploy/actions/workflows/deploy.yml/runs?per_page=20" \
            --jq '.workflow_runs[] | "\(.id) \(.created_at) \(.display_title)"' 2>/dev/null | grep -F " $TITLE" | awk -v s="$START" '$2 >= s {print $1}' | head -1 || true)"
          if [ -n "$RUN_ID" ]; then echo -e "🔍 found central run $RUN_ID"; break; fi
          echo "⏳ waiting for central run to appear... ($i)"
          sleep 15
        done
        [ -n "$RUN_ID" ] || { echo "::error::central deploy run not found within 10m"; exit 1; }
        echo "WLG_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

        # --- wait for completion, mirror the result ---
        for i in $(seq 1 40); do
          RESULT="$(GH_TOKEN="$PAT" gh api "repos/wlgdev/deploy/actions/runs/$RUN_ID" --jq '"\(.status)/\(.conclusion)"' 2>/dev/null || true)"
          echo "⏳ central run $RUN_ID: ${RESULT:-api-hiccup} — https://github.com/wlgdev/deploy/actions/runs/$RUN_ID"
          case "$RESULT" in
            completed/success) echo -e "${GREEN}✅ deploy OK${NC}"; exit 0;;
            completed/*) echo -e "${RED}❌ central deploy FAILED ($RESULT), logs linked above${NC}"; exit 1;;
          esac
          sleep 15
        done
        echo "::error::timed out waiting for central deploy"; exit 1
      shell: bash
      env:
        PAT: ${{ inputs.pat }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        COMPOSE_PATH: ${{ inputs.docker_compose_path }}
        IS_DEV: ${{ inputs.is_dev }}
        IMAGE_NAME_IN: ${{ inputs.service_image_name }}
        IMAGE_TAG_IN: ${{ inputs.service_image_tag }}
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        ENV_INPUT: ${{ inputs.env }}
        TARGET_IN: ${{ inputs.target }}
        CENTRAL_REF: ${{ inputs.central_ref }}

    - name: 📋 Summary
      if: always()
      run: |
        if [ "${{ steps.deploy.outcome }}" = "success" ]; then
          echo "## ✅ Deploy OK" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## ❌ Deploy failed" >> "$GITHUB_STEP_SUMMARY"
        fi
        {
          echo ""
          echo "- Image: \`${WLG_IMAGE:-—}\`"
          echo "- Stack: \`${WLG_TITLE:-—}\` (is_dev=${{ inputs.is_dev }})"
          if [ -n "${WLG_RUN_ID:-}" ]; then
            echo "- Central run: ${{ github.server_url }}/wlgdev/deploy/actions/runs/$WLG_RUN_ID"
          else
            echo "- Central run: not found (dispatch may have failed)"
          fi
          if [ -n "${WLG_TARGET:-}" ]; then
            echo "- Traefik target:"
            echo '```'
            echo "$WLG_TARGET"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
